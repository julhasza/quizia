server:
  port: 8080
spring:
  application:
    name: quizia-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
llm:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  demo-mode: ${LLM_DEMO_MODE:false}
